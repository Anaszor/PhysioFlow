version: '3.8'

services:
  # PostgreSQL Database Service
  postgres-db:
    image: postgres:16-alpine
    container_name: physioclinic_postgres
    restart: always
    environment:
      POSTGRES_DB: physioclinic_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ASP.NET Core Clinic Web Application
  clinic-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: physioclinic_web
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseProvider=PostgreSql
      - ConnectionStrings__PostgreSqlConnection=Host=postgres-db;Port=5432;Database=physioclinic_db;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  pgdata:
